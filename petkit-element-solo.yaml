time:
  # The stock firmware stores local time in the RTC; ESPHome stores UTC.
  # The first boot after flashing may be off by the old offset until SNTP syncs.
  - platform: pcf8563
    id: rtc_time
    address: 0x51
    timezone: $timezone
  # Home Assistant time over the API: works even when the network blocks NTP.
  - platform: homeassistant
    id: ha_time
    timezone: $timezone
    on_time_sync:
      then:
        - pcf8563.write_time:
            id: rtc_time
  - id: sntp_time
    platform: sntp
    timezone: $timezone
    servers:
      - !secret ntp_server
      - 0.pool.ntp.org # fallbacks if the local server does not answer
      - 1.pool.ntp.org
    on_time_sync:
      then:
        - pcf8563.write_time:
            id: rtc_time
    on_time:
      - hours: "*"
        minutes: 0
        seconds: 0
        then:
          - lambda: |-
              number::Number *slots[24] = {
                id(schedule_cups_0000), id(schedule_cups_0100), id(schedule_cups_0200), id(schedule_cups_0300),
                id(schedule_cups_0400), id(schedule_cups_0500), id(schedule_cups_0600), id(schedule_cups_0700),
                id(schedule_cups_0800), id(schedule_cups_0900), id(schedule_cups_1000), id(schedule_cups_1100),
                id(schedule_cups_1200), id(schedule_cups_1300), id(schedule_cups_1400), id(schedule_cups_1500),
                id(schedule_cups_1600), id(schedule_cups_1700), id(schedule_cups_1800), id(schedule_cups_1900),
                id(schedule_cups_2000), id(schedule_cups_2100), id(schedule_cups_2200), id(schedule_cups_2300),
              };
              int hour = id(sntp_time).now().hour;
              if (hour >= 0 && hour < 24) {
                id(actuate_feeder)->execute((int) slots[hour]->state);
              }

binary_sensor:
  # FUNC button (stock): press = key beep, click = cancel the feed, hold ~1.5 s = feed while held.
  - id: manual_feed_button
    internal: true
    platform: gpio
    pin:
      number: GPIO34
      inverted: true
    filters:
      - delayed_on_off: 20ms # stock: 2 ticks of 10 ms
    on_press:
      then:
        - lambda: id(play_rtttl)->execute("${beep_short}");
        - script.execute: button_hold
    on_release:
      then:
        - script.stop: button_hold
        - lambda: feeder::motor().release(millis());
    on_click:
      - min_length: 20ms
        max_length: 1000ms
        then:
          - lambda: |-
              auto &m = feeder::motor();
              if (m.busy() && !m.hold_mode()) {
                ESP_LOGI("feeder", "Feed cancelled by button");
                m.cancel(millis());
              }
  # SET button (stock: press = key beep, long = network pairing). Only the beep here.
  - id: set_button
    internal: true
    platform: gpio
    pin:
      number: GPIO0
      inverted: true
      ignore_strapping_warning: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      then:
        - lambda: id(play_rtttl)->execute("${beep_short}");
  # Grate switch, low when the grate closes the outlet: one loop per closure.
  - id: motor_sensor
    internal: true
    platform: gpio
    pin:
      number: GPIO27
      inverted: true
    on_press:
      then:
        - lambda: |-
            auto &m = feeder::motor();
            m.on_grate_edge(millis());
            if (m.busy()) ESP_LOGD("feeder", "%d/%d loops", m.loops_done(), m.target());
  # Outlet IR, high when something covers the beam: food crossing the outlet.
  - id: feed_sensor
    internal: true
    platform: gpio
    pin:
      number: GPIO14
    on_press:
      then:
        - lambda: |-
            feeder::motor().on_outlet_rise();
            id(food_sensor_count) += 1;
  # Stock idle filter on the outlet IR: covered 2 s sets BLOCK_DOOR, free 1 s clears it.
  - id: outlet_covered_idle
    internal: true
    platform: template
    lambda: return id(feed_sensor).state;
    filters:
      - delayed_on: 2s
      - delayed_off: 1s
    on_state:
      then:
        - lambda: |-
            if (feeder::motor().busy()) return;
            id(outlet_blocked_latched) = x;
            id(outlet_blocked).publish_state(x);
  - platform: template
    id: outlet_blocked
    name: "Outlet blocked"
    device_class: problem
    icon: mdi:tray-alert
  # Kibble IR in the hopper: GPIO13 high = food low (stock food state 1).
  # Checked on the device: a full hopper reads GPIO13 low.
  - id: food_low
    platform: gpio
    name: "Food low"
    device_class: problem
    icon: mdi:food-drumstick-off
    pin:
      number: GPIO13
    filters:
      - delayed_on_off: 30ms # stock: 3 identical reads
    on_press:
      then:
        - lambda: |-
            id(feeder_state).publish_state("Food level is low");
            id(dispatch_feeder_food_low_event)->execute("${friendly_name} food level is low. Check the hopper.");
  # GPIO21 high = running on batteries (stock "bat" flag).
  - id: on_battery
    platform: gpio
    name: "On battery"
    entity_category: diagnostic
    icon: mdi:battery
    pin:
      number: GPIO21
  # Stock DC_ERR: on DC, input outside 4.5-7.0 V; on battery, input above 7.0 V; for > 4 s.
  - platform: template
    id: dc_fault
    name: "Power fault"
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      float dc = id(dc_voltage).state;
      if (isnan(dc)) return false;
      return id(on_battery).state ? dc > 7.0f : (dc < 4.5f || dc > 7.0f);
    filters:
      - delayed_on: 4s
  # Stock "low energy": on battery and battery at or below 5.499 V refuses feeding.
  - platform: template
    id: low_battery
    name: "Low battery"
    device_class: battery
    lambda: |-
      float bat = id(battery_voltage).state;
      return id(on_battery).state && !isnan(bat) && bat <= 5.499f;

text_sensor:
  - platform: template
    name: "State"
    id: feeder_state
    entity_category: diagnostic
  - platform: template
    name: "Motor fault"
    id: motor_fault
    icon: mdi:alert-circle-outline
    entity_category: diagnostic
  - platform: template
    name: "Last Feed Time"
    id: last_feed_time
    lambda: |-
      if (id(last_feed_timestamp) == 0) {
        return {"Never"};
      }
      auto time = ESPTime::from_epoch_local(id(last_feed_timestamp));
      char str[20];
      auto c_tm = time.to_c_tm();
      strftime(str, sizeof(str), "%Y-%m-%d %H:%M", &c_tm);
      return {str};
    update_interval: 60s

switch:
  - id: enable_sensors
    internal: true
    platform: gpio
    pin:
      number: GPIO33
    restore_mode: ALWAYS_ON
    disabled_by_default: true
  - id: mute_sounds
    name: Mute sounds
    icon: mdi:volume-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    platform: template
  # Stock "manual lock": the button no longer starts a feed.
  - id: child_lock
    name: Child lock
    icon: mdi:lock
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    platform: template
  - id: food_low_alarm
    name: Food low alarm
    icon: mdi:bell-alert
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    platform: template

sensor:
  - platform: wifi_signal
    name: "Signal"
    update_interval: 60s
  # Motor current shunt: ADC1 channel 4, 0 dB, read on demand by the motor loop.
  - platform: adc
    id: motor_current_adc
    internal: true
    pin: GPIO32
    attenuation: 0db
    samples: 32
    update_interval: never
  - platform: template
    id: feed_max_current
    name: "Last feed max motor current"
    icon: mdi:current-dc
    entity_category: diagnostic
    unit_of_measurement: mV
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: feed_unjam_attempts
    name: "Last feed un-jam attempts"
    icon: mdi:rotate-left
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never
  # Stock dc_mv: ADC1 channel 3, 11 dB, divider 147/47.
  - platform: adc
    id: dc_voltage
    name: "DC input voltage"
    pin: GPIO39
    attenuation: 12db
    entity_category: diagnostic
    update_interval: 2s
    filters:
      - multiply: 3.12766
      - delta: 0.05
  # Stock bat_mv: ADC1 channel 0, 11 dB, divider 147/47. On battery, stock keeps the 30 min peak.
  - platform: adc
    id: battery_voltage
    name: "Battery voltage"
    pin: GPIO36
    attenuation: 12db
    entity_category: diagnostic
    update_interval: 60s
    filters:
      - multiply: 3.12766
      - max:
          window_size: 30
          send_every: 1
  - platform: template
    id: dispensed_food_quantity
    name: "Dispensed food quantity"
    icon: mdi:cup
    entity_category: diagnostic
    state_class: "measurement"
    accuracy_decimals: 0
    lambda: |-
      return id(last_food_sensor_count);
  - platform: template
    id: dispensed_food_scoops
    name: "Dispensed food scoops"
    icon: mdi:cup
    entity_category: diagnostic
    state_class: "measurement"
    accuracy_decimals: 0
    lambda: |-
      return id(last_food_scoops_count);

button:
  - name: "Dispense food"
    id: dispense_food
    icon: mdi:food-turkey
    platform: template
    on_press:
      - lambda: id(actuate_feeder)->execute((int) id(default_scoops).state);
  - name: "Cancel feed"
    id: cancel_feed
    icon: mdi:stop
    platform: template
    on_press:
      - lambda: feeder::motor().cancel(millis());
  - platform: restart
    name: "Restart"
    disabled_by_default: true
