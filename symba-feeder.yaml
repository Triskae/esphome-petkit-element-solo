# My second feeder: same as hella-feeder.yaml, its own name and credentials.
substitutions:
  name: symba-feeder
  friendly_name: Symba Feeder
  timezone: Europe/Paris
  ntp_server: !secret ntp_server
  feeder_component_source: components

packages:
  hardware: !include config.yaml
  feeder: !include feeder.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret symba_api_encryption_key

ota:
  - platform: esphome
    password: !secret symba_ota_password

web_server:
  port: 80
